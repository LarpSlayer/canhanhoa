<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi Chú & Code Snippets - Album Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(135deg, #1e1e2f, #111119) no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            padding: 15px; 
            max-width: 600px; 
            margin: 0 auto; 
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }
        h2 { text-align: center; color: #00a2ff; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .box { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #00a2ff; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(5px); color: #fff; box-sizing: border-box; font-size: 15px; }
        select.box { cursor: pointer; }
        textarea.box { height: 100px; resize: vertical; font-family: monospace; }
        .btn { background: #00a2ff; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,162,255,0.3); }
        
        /* Backup & BG Bar */
        .backup-bar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-sub { background: rgba(34, 34, 34, 0.85); backdrop-filter: blur(5px); color: #00a2ff; border: 1px solid #00a2ff; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; flex: 1; min-width: 120px; cursor: pointer; text-align: center; }

        /* Album Bar Styles */
        .album-section { margin-bottom: 15px; }
        .album-title { font-size: 14px; color: #ccc; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .album-title button { background: none; border: none; color: #00a2ff; cursor: pointer; font-size: 13px; font-weight: bold; }
        .album-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .album-list::-webkit-scrollbar { display: none; }
        .album-chip { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(5px); border: 1px solid #333; color: #ccc; padding: 6px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .album-chip.active { background: #00a2ff; color: #fff; border-color: #00a2ff; font-weight: bold; }
        .album-del-btn { color: #ff4d4d; font-weight: bold; font-size: 12px; cursor: pointer; padding: 0 2px; }
        .album-del-btn:hover { color: #fff; }

        /* Card & Note Styles */
        .card { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(5px); padding: 12px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #00a2ff; position: relative; word-break: break-word; }
        .card-header { cursor: pointer; user-select: none; padding-right: 55px; }
        .card b { font-size: 16px; color: #fff; display: inline-block; margin-bottom: 4px; }
        .card .toggle-icon { font-size: 12px; color: #00a2ff; margin-left: 6px; }
        .card .album-tag { font-size: 11px; background: #00a2ff22; color: #00a2ff; padding: 2px 8px; border-radius: 4px; border: 1px solid #00a2ff44; display: inline-block; margin-bottom: 8px; }
        .card-body { display: none; margin-top: 8px; }
        .card-body.open { display: block; }
        .card pre { background: rgba(13, 13, 13, 0.9); padding: 10px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 13px; color: #00ff66; white-space: pre-wrap; margin: 8px 0; }
        .media-preview img, .media-preview video { max-width: 100%; border-radius: 6px; margin-top: 8px; }
        .del { position: absolute; right: 10px; top: 10px; background: #ff4d4d; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .copy-btn { background: #333; color: #00a2ff; border: 1px solid #00a2ff; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; float: right; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>🧠 KHO CODE & ALBUM</h2>
    
    <!-- Thanh Backup / Restore / Hình nền -->
    <div class="backup-bar">
        <button class="btn-sub" onclick="exportData()">📥 Tải Backup</button>
        <button class="btn-sub" onclick="document.getElementById('importFile').click()">📤 Phục Hồi</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        
        <button class="btn-sub" onclick="document.getElementById('bgInput').click()">🖼️ Đổi Hình Nền</button>
        <input type="file" id="bgInput" accept="image/*" style="display:none" onchange="changeBg(event)">
        <button class="btn-sub" onclick="resetBg()" style="max-width: 50px;" title="Reset nền">↺</button>
    </div>

    <!-- Thanh chọn & Quản lý Album -->
    <div class="album-section">
        <div class="album-title">
            <span>DANH SÁCH ALBUM</span>
            <button onclick="addCustomAlbum()">+ Tạo Album Mới</button>
        </div>
        <div class="album-list" id="albumChips"></div>
    </div>

    <!-- Ô tìm kiếm -->
    <input id="s" class="box" placeholder="🔍 Tìm kiếm..." oninput="search()">

    <!-- Form nhập Note -->
    <input id="t" class="box" placeholder="Tiêu đề">
    <select id="aSelect" class="box" style="display:none;"></select>
    <textarea id="c" class="box" placeholder="Nội dung code / Văn bản / Link ảnh video..."></textarea>
    <button class="btn" onclick="add()">+ LƯU TẬP TỆP</button>

    <!-- Danh sách hiển thị -->
    <div id="list"></div>

    <script>
        let defaultAlbums = ["Tất cả"];
        let albums = JSON.parse(localStorage.getItem("my_albums") || JSON.stringify(defaultAlbums));
        let notes = JSON.parse(localStorage.getItem("my_notes") || "[]");
        let currentAlbum = "Tất cả";
        let fuse;

        // Quản lý hình nền
        function loadSavedBg() {
            let savedBg = localStorage.getItem("custom_bg");
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
            }
        }

        function changeBg(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(evt) {
                    let bgData = evt.target.result;
                    document.body.style.backgroundImage = `url('${bgData}')`;
                    try {
                        localStorage.setItem("custom_bg", bgData);
                    } catch (err) {
                        alert("Ảnh quá lớn để lưu tự động, nhưng vẫn sẽ hiển thị trong phiên làm việc này!");
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function resetBg() {
            localStorage.removeItem("custom_bg");
            document.body.style.backgroundImage = "linear-gradient(135deg, #1e1e2f, #111119)";
        }

        function initFuse(data) {
            fuse = new Fuse(data, { threshold: 0.4, keys: ["title", "content", "album"] });
        }

        function saveData() {
            localStorage.setItem("my_notes", JSON.stringify(notes));
            localStorage.setItem("my_albums", JSON.stringify(albums));
        }

        function renderAlbums() {
            let chipsHTML = "";
            albums.forEach(a => {
                let activeClass = (a === currentAlbum) ? "active" : "";
                let delBtn = (a !== "Tất cả") ? `<span class="album-del-btn" onclick="deleteAlbum(event, '${escapeHtml(a)}')">✕</span>` : '';
                chipsHTML += `<div class="album-chip ${activeClass}" onclick="selectAlbum('${escapeHtml(a)}')">
                    <span>${escapeHtml(a)}</span>
                    ${delBtn}
                </div>`;
            });
            document.getElementById("albumChips").innerHTML = chipsHTML;

            let customAlbums = albums.filter(a => a !== "Tất cả");
            let selectEl = document.getElementById("aSelect");
            
            if (customAlbums.length > 0) {
                let selectHTML = "";
                customAlbums.forEach(a => {
                    selectHTML += `<option value="${escapeHtml(a)}">📁 Album: ${escapeHtml(a)}</option>`;
                });
                selectEl.innerHTML = selectHTML;
                selectEl.style.display = "block";
            } else {
                selectEl.style.display = "none";
            }
        }

        function selectAlbum(name) {
            currentAlbum = name;
            renderAlbums();
            search();
        }

        function addCustomAlbum() {
            let name = prompt("Nhập tên Album mới:");
            if (name && name.trim()) {
                name = name.trim();
                if (!albums.includes(name)) {
                    albums.push(name);
                    saveData();
                    selectAlbum(name);
                } else {
                    alert("Album này đã tồn tại!");
                }
            }
        }

        function deleteAlbum(event, name) {
