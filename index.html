<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi Chú & Code Snippets - Album Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 15px; max-width: 600px; margin: 0 auto; }
        h2 { text-align: center; color: #00a2ff; margin-bottom: 15px; }
        .box { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #00a2ff; background: #1e1e1e; color: #fff; box-sizing: border-box; font-size: 15px; }
        select.box { cursor: pointer; }
        textarea.box { height: 100px; resize: vertical; font-family: monospace; }
        .btn { background: #00a2ff; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; margin-bottom: 15px; cursor: pointer; }
        
        /* Backup Bar */
        .backup-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-sub { background: #222; color: #00a2ff; border: 1px solid #00a2ff; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; flex: 1; cursor: pointer; text-align: center; }

        /* Album Bar Styles */
        .album-section { margin-bottom: 15px; }
        .album-title { font-size: 14px; color: #aaa; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .album-title button { background: none; border: none; color: #00a2ff; cursor: pointer; font-size: 13px; font-weight: bold; }
        .album-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .album-list::-webkit-scrollbar { display: none; }
        .album-chip { background: #1e1e1e; border: 1px solid #333; color: #ccc; padding: 6px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .album-chip.active { background: #00a2ff; color: #fff; border-color: #00a2ff; font-weight: bold; }
        
        /* Card & Note Styles */
        .card { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #00a2ff; position: relative; word-break: break-word; }
        .card b { font-size: 16px; color: #fff; display: block; margin-bottom: 4px; }
        .card .album-tag { font-size: 11px; background: #00a2ff22; color: #00a2ff; padding: 2px 8px; border-radius: 4px; border: 1px solid #00a2ff44; display: inline-block; margin-bottom: 8px; }
        .card pre { background: #0d0d0d; padding: 10px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 13px; color: #00ff66; white-space: pre-wrap; margin: 8px 0; }
        .media-preview img, .media-preview video { max-width: 100%; border-radius: 6px; margin-top: 8px; }
        .del { position: absolute; right: 10px; top: 10px; background: #ff4d4d; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .copy-btn { background: #333; color: #00a2ff; border: 1px solid #00a2ff; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; float: right; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>🧠 KHO CODE & ALBUM</h2>
    
    <!-- Thanh Backup / Restore -->
    <div class="backup-bar">
        <button class="btn-sub" onclick="exportData()">📥 Tải File Sao Lưu</button>
        <button class="btn-sub" onclick="document.getElementById('importFile').click()">📤 Khôi Phục File</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>

    <!-- Thanh chọn & Quản lý Album -->
    <div class="album-section">
        <div class="album-title">
            <span>DANH SÁCH ALBUM</span>
            <button onclick="addCustomAlbum()">+ Tạo Album Mới</button>
        </div>
        <div class="album-list" id="albumChips"></div>
    </div>

    <!-- Ô tìm kiếm -->
    <input id="s" class="box" placeholder="🔍 Tìm kiếm trong Album..." oninput="search()">

    <!-- Form nhập Note -->
    <input id="t" class="box" placeholder="Tiêu đề (VD: Script Blox Fruits, Link Video FB...)">
    <select id="aSelect" class="box"></select>
    <textarea id="c" class="box" placeholder="Nội dung code / Văn bản / Link ảnh video..."></textarea>
    <button class="btn" onclick="add()">+ LƯU TẬP TỆP</button>

    <!-- Danh sách hiển thị -->
    <div id="list"></div>

    <script>
        let defaultAlbums = ["Tất cả", "Roblox Script", "Web Code", "Ảnh & Video", "Khác"];
        let albums = JSON.parse(localStorage.getItem("my_albums") || JSON.stringify(defaultAlbums));
        let notes = JSON.parse(localStorage.getItem("my_notes") || "[]");
        let currentAlbum = "Tất cả";
        let fuse;

        function initFuse(data) {
            fuse = new Fuse(data, { threshold: 0.4, keys: ["title", "content", "album"] });
        }

        function saveData() {
            localStorage.setItem("my_notes", JSON.stringify(notes));
            localStorage.setItem("my_albums", JSON.stringify(albums));
        }

        function renderAlbums() {
            let chipsHTML = "";
            albums.forEach(a => {
                let activeClass = (a === currentAlbum) ? "active" : "";
                chipsHTML += `<div class="album-chip ${activeClass}" onclick="selectAlbum('${escapeHtml(a)}')">${escapeHtml(a)}</div>`;
            });
            document.getElementById("albumChips").innerHTML = chipsHTML;

            let selectHTML = "";
            albums.filter(a => a !== "Tất cả").forEach(a => {
                selectHTML += `<option value="${escapeHtml(a)}">📁 Album: ${escapeHtml(a)}</option>`;
            });
            document.getElementById("aSelect").innerHTML = selectHTML;
        }

        function selectAlbum(name) {
            currentAlbum = name;
            renderAlbums();
            search();
        }

        function addCustomAlbum() {
            let name = prompt("Nhập tên Album mới:");
            if (name && name.trim()) {
                name = name.trim();
                if (!albums.includes(name)) {
                    albums.push(name);
                    saveData();
                    selectAlbum(name);
                } else {
                    alert("Album này đã tồn tại!");
                }
            }
        }

        function renderNotes(data) {
            let h = "";
            data.forEach(n => {
                let isCode = n.content.includes("function") || n.content.includes("local ") || n.content.includes("<html") || n.content.length > 80;
                let mediaHTML = getMediaEmbed(n.content);
                let albumTag = n.album ? `<span class="album-tag">📁 ${escapeHtml(n.album)}</span>` : '';

                h += `<div class="card">
                    <button class="del" onclick="del(${n.id})">Xóa</button>
                    <div>
                        <b>${escapeHtml(n.title)}</b>
                        ${albumTag}
                    </div>
                    ${isCode ? `<button class="copy-btn" onclick="copyText(${n.id})">📋 Copy Code</button>` : ''}
                    <pre id="code-${n.id}">${escapeHtml(n.content)}</pre>
                    ${mediaHTML}
                </div>`;
            });
            document.getElementById("list").innerHTML = h || "<p style='text-align:center;color:#666'>Chưa có ghi chú nào</p>";
        }

        function getMediaEmbed(text) {
            let imgMatch = text.match(/(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp))/i);
            if (imgMatch) return `<div class="media-preview"><img src="${imgMatch[0]}" /></div>`;
            return '';
        }

        function copyText(id) {
            let note = notes.find(n => n.id === id);
            if (note) {
                navigator.clipboard.writeText(note.content);
                alert("Đã copy code vào bộ nhớ tạm!");
            }
        }

        function add() {
            let t = document.getElementById("t").value.trim();
            let c = document.getElementById("c").value.trim();
            let a = document.getElementById("aSelect").value;
            if (!t && !c) return alert("Nhập nội dung vào!");
            
            notes.unshift({ id: Date.now(), title: t || "Ghi chú", content: c, album: a || "Khác" });
            saveData();
            search();
            document.getElementById("t").value = "";
            document.getElementById("c").value = "";
        }

        function del(id) {
            if (confirm("Xóa note này?")) {
                notes = notes.filter(n => n.id !== id);
                saveData();
                search();
            }
        }

        function search() {
            let q = document.getElementById("s").value.trim();
            let filtered = (currentAlbum === "Tất cả") ? notes : notes.filter(n => n.album === currentAlbum);
            if (q) {
                initFuse(filtered);
                renderNotes(fuse.search(q).map(r => r.item));
            } else {
                renderNotes(filtered);
            }
        }

        function exportData() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ notes, albums }));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_notes_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let imported = JSON.parse(e.target.result);
                    if (imported.notes && imported.albums) {
                        notes = imported.notes;
                        albums = imported.albums;
                        saveData();
                        renderAlbums();
                        search();
                        alert("Khôi phục dữ liệu thành công!");
                    }
                } catch (err) {
                    alert("File không hợp lệ!");
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(t) { return (t || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

        renderAlbums();
        search();
    </script>
</body>
</html>
